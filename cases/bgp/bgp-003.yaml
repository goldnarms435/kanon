id: bgp-003
version_introduced: "0.1"
category: bgp-path-selection
subcategory: med-scoping
difficulty: advanced
tags:
  - med
  - always-compare-med
  - decision-process
status: active
author: netbench-seed
created_at: "2026-05-20"
reviewed_by:
  - "Ernest McCaleb (CCIE editor)"
references:
  - "RFC 4451 §3 (always-compare-med extension)"
  - "Cisco BGP Best Path Selection — always-compare-med behavior"

prompt: |
  Same topology as bgp-002:

  - Route A: from AS 65001, AS-path "65001 65010", MED 100, IGP cost 10.
  - Route B: from AS 65001, AS-path "65001 65020", MED 50,  IGP cost 20.
  - Route C: from AS 65002, AS-path "65002 65030", MED 10,  IGP cost 30.

  Local Preference is 100 on all three. AS-path length 2 on all three.

  This time, `bgp always-compare-med` is configured globally on R1.

  Which route is installed as best?

scoring:
  type: multiple_choice
  choices:
    A: "Route A — lowest IGP cost (10)."
    B: "Route B — wins MED within AS 65001 group."
    C: "Route C — lowest MED globally (10)."
    D: "Route B — oldest eBGP path."
  correct: C

reference_answer: |
  **Route C.**

  With `bgp always-compare-med` enabled, MED is compared across all
  paths regardless of neighboring AS. The decision proceeds:

    1. Weight, LP, AS-path length, origin — all tie.
    2. MED (always-compare-med enabled): A=100, B=50, **C=10** → C wins.

  IGP cost and other tiebreakers are not evaluated.

  This case pairs with bgp-002 to test whether the model understands
  the operational impact of toggling `always-compare-med` — a common
  knob in service-provider networks where consistent MED semantics
  across peerings are required, and a common source of misconfig in
  enterprise multi-homing.

common_wrong_answers:
  - answer: "Route B — wins MED within AS 65001 group."
    why_wrong: "With always-compare-med, MED is compared globally. The AS-grouping no longer applies."
  - answer: "Route A — lowest IGP cost."
    why_wrong: "IGP cost is only reached if MED ties. With always-compare-med, MED decides before IGP cost."
